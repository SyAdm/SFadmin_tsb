---
- name: Uninstall and cleanup Zabbix Agent
  hosts: all
  become: yes

  tasks:
    - name: Stop zabbix-agent service
      ansible.builtin.service:
        name: zabbix-agent
        state: stopped
      ignore_errors: yes

    - name: Disable zabbix-agent service
      ansible.builtin.service:
        name: zabbix-agent
        enabled: no
      ignore_errors: yes

    - name: Remove zabbix-agent package on Debian/Ubuntu
      ansible.builtin.apt:
        name: zabbix-agent
        state: absent
        purge: yes
      when: ansible_os_family == "Debian"

    - name: Remove zabbix-agent package on RedHat/CentOS
      ansible.builtin.yum:
        name: zabbix-agent
        state: absent
      when: ansible_os_family == "RedHat"

    - name: Remove zabbix directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/zabbix
        - /var/log/zabbix
        - /var/run/zabbix

