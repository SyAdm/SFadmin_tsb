- hosts: all
  become: yes

  tasks:

    - name: Ensure logging lines for Apache are present (only for apache group)
      lineinfile:
        path: /home/ansible-admin/testweb.sh
        insertafter: EOF
        line: "{{ item }}"
        state: present
      with_items:
        - 'date &>> /var/log/web.log'
        - 'httpd -t &>> /var/log/web.log'
      when: inventory_hostname in groups['apache']

    - name: cron
      cron:
        name: "check dirs"
        minute: "0"
        hour: "5,2"
        job: "ls -alh > /dev/null"

    - name: nginx cron
      cron:
        name: "cron script"
        minute: "*/2"
        job: "/home/ansible-admin/testweb.sh > /dev/null"
      when: inventory_hostname in groups['apache']
