- name: Install zabbix-agent on Debian/Ubuntu
  apt:
    name: zabbix-agent
    state: present
    update_cache: yes
  become: yes
  when: ansible_os_family == "Debian"

- name: Install zabbix-agent on RedHat/CentOS
  yum:
    name: zabbix-agent
    state: present
  become: yes
  when: ansible_os_family == "RedHat"

- name: Configure zabbix_agent
  template:
    src: zabbix_agentd.conf.j2
    dest: /etc/zabbix/zabbix_agentd.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart zabbix-agent
  become: yes

- name: Enable and start zabbix-agent
  service:
    name: zabbix-agent
    state: started
    enabled: yes
  become: yes

